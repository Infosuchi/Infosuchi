<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Noticias - Inicio</title>
    <style id="dynamic-styles"></style>
</head>
<body>

    <header class="main-header" id="header-banner">
        <h1 id="site-title">Cargando Portal...</h1>
        <p id="site-subtitle">Información oportuna y veraz</p>
    </header>

    <div class="layout-container">
        <!-- Columna Izquierda: Menú de Categorías -->
        <aside class="left-sidebar">
            <h3>Categorías</h3>
            <ul id="categories-list">
                <li><a href="index.html">Todas las noticias</a></li>
            </ul>
        </aside>

        <!-- Parte Central: Feed de Noticias -->
        <main class="content-feed" id="news-feed">
            <p>Cargando noticias...</p>
        </main>

        <!-- Columna Derecha: 10 Últimas Noticias -->
        <aside class="right-sidebar">
            <h3>Últimas 10 Noticias</h3>
            <ul id="latest-news-list">
                <li>Cargando...</li>
            </ul>
        </aside>
    </div>

    <!-- Paginación -->
    <div class="pagination" id="pagination-controls"></div>

    <footer class="main-footer">
        <p>&copy; 2026 Portal de Noticias. Todos los derechos reservados. Alojado en GitHub Pages.</p>
    </footer>

    <script type="module">
        import { db, collection, getDocs, query, orderBy, limit, globalStyles } from './firebase-config.js';
        document.getElementById('dynamic-styles').innerHTML = globalStyles;

        let allNews = [];
        let currentCategory = new URLSearchParams(window.location.search).get('cat');
        let currentPage = 1;
        const postsPerPage = 5;

        async function initPortal() {
            try {
                // Cargar Configuración del Sitio (Banner superior)
                const configSnap = await getDocs(collection(db, "configuracion"));
                if (!configSnap.empty) {
                    const cfg = configSnap.docs[0].data();
                    document.getElementById('site-title').innerText = cfg.titulo || "Portal de Noticias";
                    document.getElementById('site-subtitle').innerText = cfg.subtitulo || "Actualidad al instante";
                }

                // Cargar Noticias ordenadas por fecha descendente
                const q = query(collection(db, "noticias"), orderBy("fecha", "desc"));
                const querySnapshot = await getDocs(q);
                allNews = [];
                let categoriesSet = new Set();

                querySnapshot.forEach((docSnap) => {
                    let data = docSnap.data();
                    allNews.push({ id: docSnap.id, ...data });
                    if (data.categoria) categoriesSet.add(data.categoria);
                });

                renderCategories(categoriesSet);
                renderLatestNews();
                renderFeed();

            } catch (error) {
                console.error("Error al cargar datos:", error);
                document.getElementById('news-feed').innerHTML = `<p>Error al conectar con la base de datos de Firebase. Verifica tu configuración.</p>`;
            }
        }

        function renderCategories(categoriesSet) {
            const catList = document.getElementById('categories-list');
            categoriesSet.forEach(cat => {
                catList.innerHTML += `<li><a href="index.html?cat=${encodeURIComponent(cat)}">${cat}</a></li>`;
            });
        }

        function renderLatestNews() {
            const latestList = document.getElementById('latest-news-list');
            latestList.innerHTML = "";
            const latest10 = allNews.slice(0, 10);
            if (latest10.length === 0) {
                latestList.innerHTML = "<li>No hay noticias recientes</li>";
                return;
            }
            latest10.forEach(news => {
                latestList.innerHTML += `<li><a href="noticia.html?id=${news.id}">${news.titulo}</a></li>`;
            });
        }

        function renderFeed() {
            const feed = document.getElementById('news-feed');
            feed.innerHTML = "";

            // Filtrar por categoría si existe en la URL
            let filteredNews = allNews;
            if (currentCategory) {
                filteredNews = allNews.filter(n => n.categoria === currentCategory);
                document.querySelector('.main-header h1').innerText += ` - Categoría: ${currentCategory}`;
            }

            const startIndex = (currentPage - 1) * postsPerPage;
            const currentPosts = filteredNews.slice(startIndex, startIndex + postsPerPage);

            if (currentPosts.length === 0) {
                feed.innerHTML = "<p>No se encontraron publicaciones en esta sección.</p>";
                document.getElementById('pagination-controls').innerHTML = "";
                return;
            }

            currentPosts.forEach(news => {
                let mediaHtml = "";
                if (news.mediaUrl) {
                    if (news.mediaType === 'video' || news.mediaUrl.includes('youtube') || news.mediaUrl.endsWith('.mp4')) {
                        mediaHtml = `<video class="news-media" controls src="${news.mediaUrl}"></video>`;
                    } else {
                        mediaHtml = `<img class="news-media" src="${news.mediaUrl}" alt="Imagen de la noticia">`;
                    }
                }

                feed.innerHTML += `
                    <article class="news-card">
                        <h2><a href="noticia.html?id=${news.id}">${news.titulo}</a></h2>
                        <div class="news-meta">
                            <span>✍️ <strong>${news.autor || 'Redacción'}</strong></span>
                            <span>📅 ${news.fecha || ''} ${news.hora || ''}</span>
                            <span>📂 ${news.categoria || 'General'}</span>
                        </div>
                        ${mediaHtml}
                        <div class="news-text">${news.cuerpo ? news.cuerpo.substring(0, 250) + '...' : ''}</div>
                        <div class="news-hashtags">#${news.hashtags ? news.hashtags.replaceAll(',', ' #') : 'noticias'}</div>
                        <div class="news-footer-banner">
                            📢 ${news.anuncianteHtml || 'Espacio publicitario disponible / Patrocinador oficial'}
                        </div>
                    </article>
                `;
            });

            renderPagination(filteredNews.length);
        }

        function renderPagination(totalItems) {
            const totalPages = Math.ceil(totalItems / postsPerPage);
            const paginationDiv = document.getElementById('pagination-controls');
            paginationDiv.innerHTML = "";

            if (totalPages <= 1) return;

            if (currentPage > 1) {
                paginationDiv.innerHTML += `<button onclick="changePage(${currentPage - 1})">Anterior</button>`;
            }
            paginationDiv.innerHTML += `<span>Página ${currentPage} de ${totalPages}</span>`;
            if (currentPage < totalPages) {
                paginationDiv.innerHTML += `<button onclick="changePage(${currentPage + 1})">Siguiente</button>`;
            }
        }

        window.changePage = function(page) {
            currentPage = page;
            renderFeed();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        initPortal();
    </script>
</body>
</html>
